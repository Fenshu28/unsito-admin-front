name: ⚗️ - Deploy unsito to CI
on:
  push:
    branches: [dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    environment: unsito-deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.5"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build project
        run: npm run build
        env:
          NITRO_PRESET: cloudflare-pages

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: lint-and-test
    environment: unsito-deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build/

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy build --project-name=unsitos
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}